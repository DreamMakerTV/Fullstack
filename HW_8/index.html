<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Float Layout</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="row">
      <div class="box fl"></div>
      <div class="box fr"></div>
    </div>

    <div class="row">
      <div class="box fl"></div>
      <div class="box fr"></div>
      <div class="box fr mr"></div>
      <div class="box fr mr"></div>
    </div>

    <div class="row">
      <div class="box fl"></div>
      <div class="box fl ml"></div>
      <div class="box fr"></div>
      <div class="box fr mr"></div>
    </div>

    <div class="row">
      <div class="col fr">
        <div class="box mb"></div>
        <div class="box"></div>
      </div>
      <div class="box-big fr mr"></div>
    </div>

    <div class="row">
      <div class="center-wrap">
        <div class="box-big fl"></div>
        <div class="col fl ml">
          <div class="box mb"></div>
          <div class="box"></div>
        </div>
      </div>
    </div>
  </body>
</html>
